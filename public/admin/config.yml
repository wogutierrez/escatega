backend:
  name: github
  repo: wogutierrez/escatega
  branch: main
  site_domain: escatega.com

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "articles"
    label: "Articles"
    folder: "src/content/articles"
    create: true
    slug: "{{title | slugify}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "pubDate", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "Language", name: "lang", widget: "select", options: ["en", "es"], default: "en", hint: "Choose whether this article is in English or Spanish" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Cover Image", name: "coverImage", widget: "image", required: false }
      - { 
          label: "Category", 
          name: "category", 
          widget: "select", 
          options: [
            "Save Time & Stress", 
            "Protect Your Business", 
            "Get More Clients",
            "Ahorra tiempo y estres",
            "Protege tu negocio",
            "Consigue mas clientes"
          ] 
        }
      - { label: "Featured Article", name: "featured", widget: "boolean", default: false }
      - { label: "Body", name: "body", widget: "markdown" }