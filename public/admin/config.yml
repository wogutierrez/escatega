backend:
  name: github
  repo: wogutierrez/escatega
  branch: main
  site_domain: escatega.com

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

# Global Multilingual (i18n) Setup
i18n:
  structure: multiple_folders
  locales: [en, es]
  default_locale: en

collections:
  - name: "articles"
    label: "Articles"
    folder: "src/content/articles"
    create: true
    # Compute the filename slug per language from its own title
    slug: "{{slug}}"
    i18n:
      structure: multiple_folders
      locales: [en, es]
    fields:
      - { label: "Title", name: "title", widget: "string", i18n: true }
      - { label: "Publish Date", name: "pubDate", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, i18n: duplicate }
      - { label: "Description", name: "description", widget: "text", i18n: true }
      - { label: "Cover Image", name: "coverImage", widget: "image", required: false, i18n: duplicate }
      - { label: "Category", name: "category", widget: "select", options: ["Save Time & Stress", "Protect Your Business", "Get More Clients"], i18n: duplicate }
      - { label: "Featured Article", name: "featured", widget: "boolean", default: false, i18n: duplicate }
      - { label: "Body", name: "body", widget: "markdown", i18n: true }